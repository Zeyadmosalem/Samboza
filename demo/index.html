<title>Samboza Family Finance — Demo</title>
<meta name="description" content="Clickable demo of the Samboza family finance app. Sample data only.">
<link rel="stylesheet" href="styles.css">
<script>
  /* Apply a remembered theme before first paint, so a dark-mode machine
     never flashes white. No stored choice means the OS setting decides. */
  (function () {
    try {
      var saved = localStorage.getItem('samboza-theme');
      if (saved === 'dark' || saved === 'light') document.documentElement.dataset.theme = saved;
    } catch (e) { /* private mode: fall back to the OS setting */ }
  })();
</script>

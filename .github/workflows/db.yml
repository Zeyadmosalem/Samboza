# Migrations apply cleanly and every RLS assertion holds.
# A permissions regression must break the build — that is the entire point.
name: database

on:
  push:
    paths: ['supabase/**', '.github/workflows/db.yml']
  pull_request:
    paths: ['supabase/**']

jobs:
  migrate-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ten seconds of static checks before two minutes of containers. A plan
      # count that does not match its assertions is a failed build either way;
      # failing it here says so immediately and says why.
      - name: Static checks
        run: node scripts/check-sql.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start a local Supabase stack
        run: supabase start

      - name: Apply migrations from scratch
        run: supabase db reset

      - name: Row-level security suite
        run: supabase test db
